services:
  model-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: model-monitor:latest
    container_name: model-monitor
    ports:
      - "8080:8080"
    environment:
      # 容器内监听端口
      PORT: "8080"
      # 公网部署务必设置访问令牌; 仅局域网可不设
      # ACCESS_TOKEN: "你的访问令牌"
      # CORS 白名单(被动观测跨域来源, 逗号分隔); 不设则仅同源
      # ALLOWED_ORIGINS: "http://localhost:3000"
      # SSE 长连接上限
      # MAX_SSE_CLIENTS: "50"
    volumes:
      # 持久化 30 天探测历史 CSV
      - ./data:/app/data
      # 注入你的模型配置(含 API Key, 切勿打进镜像); 文件不存在时容器内会自建默认
      - ./config.json:/app/config.json
    restart: unless-stopped
